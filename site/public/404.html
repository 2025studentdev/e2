<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="dark">
    <title>404 · 页面未找到</title>
    <style>
        :root{
            --bg:      #09090b;
            --panel:   #0c0c0f;
            --border:  rgba(34, 211, 238, .25);
            --border-hover: rgba(34, 211, 238, .8);
            --text:    #f4f4f5;
            --muted:   #a1a1aa;
            --cyan:    #22d3ee;
            --cyan-dim: rgba(34, 211, 238, .15);
            --grid:    rgba(255, 255, 255, .03);
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        }

        *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

        html{ -webkit-text-size-adjust:100%; }

        body{
            min-height:100svh;
            background-color:var(--bg);
            color:var(--text);
            font-family:var(--font-sans);
            display:grid;
            place-items:center;
            padding:clamp(16px, 4vw, 48px);
            overflow:hidden;
            -webkit-font-smoothing:antialiased;
        }

        /* 全局网格背景 */
        body::before{
            content:"";
            position:fixed; inset:0;
            z-index:-1;
            background-image:
                    linear-gradient(var(--grid) 1px, transparent 1px),
                    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size:32px 32px;
            pointer-events:none;
        }

        /* 极简外框 */
        .container{
            position:relative;
            width:100%;
            max-width:640px;
            border:1px solid var(--border);
            background:var(--panel);
            box-shadow:0 0 40px rgba(0,0,0,.6);
            padding:clamp(32px, 6vw, 64px);
            overflow:hidden;
            animation:fadeIn .6s ease-out both;
        }

        /* 内容层需要压在背景层之上 */
        .container > *:not(.watermarks){
            position:relative;
            z-index:2;
        }

        /* --- 水印区域 --- */
        .watermarks{
            position:absolute;
            inset:0;
            z-index:1;
            pointer-events:none;
            user-select:none;
            font-family:var(--font-mono);
            overflow:hidden;
        }

        .wm{
            position:absolute;
            color:#fff;
            white-space:nowrap;
            line-height:1;
            letter-spacing:.05em;
        }

        /* 具体水印定位与视觉参数 */
        .wm-1 {
            top: 15%; left: -5%;
            font-size: clamp(4rem, 12vw, 7rem);
            font-weight: 900;
            color: var(--cyan);
            opacity: .04;
            transform: rotate(-8deg);
        }

        .wm-2 {
            bottom: 8%; left: 5%;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            opacity: .05;
            letter-spacing: .15em;
        }

        .wm-3 {
            top: 25%; right: 8%;
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: var(--cyan);
            opacity: .08;
        }

        .wm-4 {
            bottom: 20%; right: 5%;
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 800;
            opacity: .03;
            transform: rotate(90deg);
            transform-origin: bottom right;
        }

        .wm-5 {
            top: 55%; left: 15%;
            font-size: clamp(.8rem, 2vw, 1.2rem);
            opacity: .07;
            word-break: break-all;
            white-space: normal;
            max-width: 150px;
            line-height: 1.4;
        }

        .wm-6 {
            bottom: -2%; right: 25%;
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 900;
            opacity: .02;
        }

        .wm-7 {
            top: 10%; right: 30%;
            font-size: clamp(.7rem, 1.5vw, .9rem);
            color: var(--cyan);
            opacity: .15;
            letter-spacing: .3em;
        }

        /* 顶部角标 */
        .top-tag{
            font-family:var(--font-mono);
            font-size:clamp(.65rem, 1.2vw, .75rem);
            letter-spacing:.2em;
            color:var(--muted);
            margin-bottom:clamp(40px, 8vw, 64px);
            display:flex;
            justify-content:space-between;
        }

        /* 中间主内容 */
        .core{
            position:relative;
            display:flex;
            flex-direction:column;
            align-items:flex-start;
        }

        .title-wrap{
            display:flex;
            align-items:center;
            gap:clamp(16px, 3vw, 24px);
        }

        /* 青色发光竖线 */
        .accent-line{
            width:6px;
            height:clamp(60px, 12vw, 96px);
            background:var(--cyan);
            box-shadow:0 0 16px var(--cyan);
            flex-shrink:0;
        }

        .digit{
            font-size:clamp(5rem, 18vw, 8rem);
            font-weight:800;
            line-height:.85;
            letter-spacing:-.03em;
            color:var(--text);
            user-select:none;
        }

        .sub{
            margin-top:clamp(16px, 3vw, 24px);
            margin-left:calc(6px + clamp(16px, 3vw, 24px));
            font-family:var(--font-mono);
            font-size:clamp(.75rem, 1.5vw, .85rem);
            letter-spacing:.3em;
            color:var(--cyan);
            text-transform:uppercase;
        }

        .desc{
            margin-top:12px;
            margin-left:calc(6px + clamp(16px, 3vw, 24px));
            font-size:clamp(.85rem, 1.5vw, .95rem);
            color:var(--muted);
            letter-spacing:.05em;
        }

        /* 装饰符号 >> */
        .decoration{
            position:absolute;
            right:-10px;
            bottom:-10px;
            font-family:var(--font-mono);
            font-size:2rem;
            color:var(--muted);
            opacity:.2;
            user-select:none;
            pointer-events:none;
        }

        /* 底部操作区 */
        .footer{
            margin-top:clamp(48px, 8vw, 64px);
            display:flex;
            justify-content:flex-end;
        }

        .back-btn{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:10px 20px;
            border:1px solid var(--border);
            color:var(--text);
            text-decoration:none;
            font-family:var(--font-mono);
            font-size:clamp(.75rem, 1.2vw, .85rem);
            letter-spacing:.1em;
            transition:all .3s ease;
            background:transparent;
            position:relative;
            z-index:2;
        }

        .back-btn:hover{
            border-color:var(--cyan);
            color:var(--cyan);
            box-shadow:0 0 15px var(--cyan-dim);
        }

        .back-btn svg{
            width:14px; height:14px;
            transition:transform .3s ease;
        }

        .back-btn:hover svg{
            transform:translateX(4px);
        }

        @keyframes fadeIn{
            from{ opacity:0; transform:translateY(10px); }
            to  { opacity:1; transform:translateY(0); }
        }

        @media (prefers-reduced-motion: reduce){
            *{ animation:none !important; transition:none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 丰富的水印层 -->
    <div class="watermarks" aria-hidden="true">
        <div class="wm wm-1">&lt;/&gt;</div>
        <div class="wm wm-2">2147483647</div>
        <div class="wm wm-3">0x7FFF</div>
        <div class="wm wm-4">0b01010100</div>
        <div class="wm wm-5">null<br>undefined<br>NaN</div>
        <div class="wm wm-6">void 0</div>
        <div class="wm wm-7">FATAL_ERROR</div>
    </div>

    <div class="top-tag">
        <span>HTTP / 404</span>
        <span>E2147DEV</span>
    </div>

    <div class="core">
        <div class="title-wrap">
            <div class="accent-line"></div>
            <h1 class="digit">404</h1>
        </div>

        <p class="sub">Page Not Found</p>
        <p class="desc">页面不存在或已被移除</p>

        <div class="decoration">&gt;&gt;</div>
    </div>

    <div class="footer">
        <a class="back-btn" href="/">
            返回首页
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
        </a>
    </div>
</div>

</body>
</html>
