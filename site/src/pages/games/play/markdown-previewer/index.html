<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Markdown 预览器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #f0efe9;
            color: #2d2d2d;
        }
        header {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: #f4f2ec;
            border-bottom: 1px solid #d8d4cc;
        }
        header .title { font-weight: 600; color: #555; font-size: 15px; }
        header .hint { color: #999; font-size: 12px; margin-left: auto; }
        header button {
            font: 13px -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #555;
            background: #fff;
            border: 1px solid #d0ccc2;
            border-radius: 4px;
            padding: 5px 12px;
            cursor: pointer;
        }
        header button:hover { background: #fbfaf7; border-color: #b5b0a4; }
        header button:active { background: #f0efe9; }

        main {
            flex: 1 1 auto;
            min-height: 0;              /* 关键：让 main 不撑破视口 */
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
        .pane {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;              /* 关键：允许面板内部滚动 */
            overflow: hidden;
        }
        .pane + .pane { border-left: 1px solid #d8d4cc; }
        .pane-label {
            flex: 0 0 auto;
            padding: 5px 14px;
            font-size: 11px;
            letter-spacing: 1px;
            color: #999;
            background: #faf9f5;
            border-bottom: 1px solid #e6e3da;
            text-transform: uppercase;
            font-family: "SF Mono", Consolas, monospace;
        }
        #src {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            padding: 16px;
            font: 14px/1.7 "SF Mono", Consolas, "Microsoft YaHei", monospace;
            background: #fdfdfb;
            color: #333;
        }
        #out {
            flex: 1 1 auto;
            min-height: 0;              /* 关键：右侧预览区才能滚动 */
            overflow: auto;
            padding: 16px 24px;
            background: #fff;
            font-size: 15px;
            line-height: 1.75;
        }
        /* rendered markdown */
        #out h1 { font-size: 1.5em; margin: .4em 0 .5em; border-bottom: 1px solid #e6e3da; padding-bottom: .3em; }
        #out h2 { font-size: 1.25em; margin: .9em 0 .5em; border-bottom: 1px solid #eee; padding-bottom: .25em; }
        #out h3 { font-size: 1.1em; margin: .8em 0 .4em; }
        #out p { margin: .5em 0; }
        #out a { color: #2f6f9f; text-decoration: none; border-bottom: 1px dotted #9db8c9; }
        #out code {
            background: #f4f2ec;
            border: 1px solid #e3e0d6;
            border-radius: 3px;
            padding: 1px 5px;
            font-size: .88em;
            font-family: "SF Mono", Consolas, monospace;
        }
        #out pre {
            background: #f7f6f2;
            border: 1px solid #e3e0d6;
            border-radius: 4px;
            padding: 10px 12px;
            overflow: auto;
            margin: .7em 0;
        }
        #out pre code { background: none; border: none; padding: 0; font-size: 13px; }
        #out blockquote {
            margin: .7em 0;
            padding: 4px 14px;
            border-left: 3px solid #c9c4b6;
            color: #6b6b6b;
            background: #faf9f5;
        }
        #out ul, #out ol { margin: .4em 0; padding-left: 1.6em; }
        #out li { margin: .2em 0; }
        #out table { border-collapse: collapse; margin: .7em 0; }
        #out th, #out td { border: 1px solid #d8d4cc; padding: 5px 12px; }
        #out th { background: #f4f2ec; }
        #out hr { border: none; border-top: 1px solid #d8d4cc; margin: 1em 0; }
        #out img { max-width: 100%; }
        .notice {
            color: #8a6d3b;
            background: #fcf8e3;
            border: 1px solid #f0e0b0;
            border-radius: 4px;
            padding: 10px 14px;
            font-size: 14px;
            line-height: 1.6;
        }
        @media (max-width: 720px) {
            header .hint { display: none; }
            main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
            .pane + .pane { border-left: none; border-top: 1px solid #d8d4cc; }
        }
    </style>
    <base target="_blank">
</head>
<body>
<header>
    <span class="title">Markdown 预览</span>
    <span class="hint">左侧编辑，右侧实时渲染；内容存在 localStorage</span>
    <button id="exportBtn" type="button">导出 HTML</button>
</header>
<main>
    <div class="pane">
        <div class="pane-label">源文件</div>
        <textarea id="src" spellcheck="false"></textarea>
    </div>
    <div class="pane">
        <div class="pane-label">预览</div>
        <div id="out"></div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
    (function () {
        'use strict';

        var src = document.getElementById('src');
        var out = document.getElementById('out');
        var KEY = 'md-previewer-draft';

        /* 备用 CDN：主 CDN 加载失败时自动换源，避免右侧空白 */
        var MARKED_FALLBACK = [
            'https://unpkg.com/marked@12.0.2/marked.min.js',
            'https://fastly.jsdelivr.net/npm/marked@12.0.2/marked.min.js',
            'https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js'
        ];
        var HLJS_FALLBACK = [
            'https://unpkg.com/@highlightjs/cdn-assets@11.9.0/highlight.min.js',
            'https://fastly.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js'
        ];

        var sample = [
            '# 一份 Markdown 样例',
            '',
            '支持**加粗**、*斜体*、`行内代码`、[链接](https://example.com) 这些基础语法。',
            '',
            '## 代码高亮',
            '',
            '```js',
            'function fib(n) {',
            '  if (n < 2) return n;',
            '  return fib(n - 1) + fib(n - 2);',
            '}',
            'console.log(fib(10));',
            '```',
            '',
            '## 列表与引用',
            '',
            '- 无序列表项一',
            '- 无序列表项二',
            '  - 嵌套项',
            '',
            '1. 有序列表第一项',
            '2. 第二项',
            '',
            '> 引用一段话，样式尽量克制。',
            '',
            '## 表格',
            '',
            '| 语言 | 诞生年份 |',
            '| --- | --- |',
            '| C | 1972 |',
            '| Python | 1991 |',
            '',
            '---',
            '',
            '内容会自动保存，刷新不丢。'
        ].join('\n');

        /* 恢复草稿：区分「没存过」和「存了空内容」 */
        try {
            var saved = localStorage.getItem(KEY);
            src.value = (saved === null) ? sample : saved;
        } catch (e) {
            src.value = sample;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function showNotice(msg) {
            out.innerHTML = '<p class="notice">' + escapeHtml(msg) + '</p>';
        }

        function render() {
            if (typeof marked === 'undefined') {
                showNotice('Markdown 解析库未能加载，右侧无法渲染。请检查网络后刷新页面。');
                return;
            }
            try {
                var html = (typeof marked.parse === 'function')
                    ? marked.parse(src.value)
                    : marked(src.value);
                out.innerHTML = html;

                if (window.hljs) {
                    var nodes = out.querySelectorAll('pre code');
                    for (var i = 0; i < nodes.length; i++) {
                        try { hljs.highlightElement(nodes[i]); } catch (e) { /* 忽略单个代码块错误 */ }
                    }
                }
            } catch (e) {
                showNotice('渲染出错：' + (e && e.message ? e.message : e));
            }
        }

        /* 依次尝试多个地址，成功即止 */
        function loadFirst(urls, test, done) {
            var i = 0;
            function tryNext() {
                if (test()) { done(true); return; }
                if (i >= urls.length) { done(false); return; }
                var s = document.createElement('script');
                s.src = urls[i++];
                s.async = false;
                s.onload = function () { test() ? done(true) : tryNext(); };
                s.onerror = tryNext;
                document.head.appendChild(s);
            }
            tryNext();
        }

        var timer;
        src.addEventListener('input', function () {
            clearTimeout(timer);
            timer = setTimeout(function () {
                try { localStorage.setItem(KEY, src.value); } catch (e) {}
                render();
            }, 120);
        });

        document.getElementById('exportBtn').addEventListener('click', function () {
            if (typeof marked === 'undefined') {
                alert('Markdown 解析库未加载，暂时无法导出。');
                return;
            }
            var body = (typeof marked.parse === 'function') ? marked.parse(src.value) : marked(src.value);
            var doc = [
                '<!DOCTYPE html>',
                '<html lang="zh-CN">',
                '<head>',
                '<meta charset="UTF-8">',
                '<meta name="viewport" content="width=device-width, initial-scale=1">',
                '<title>导出文档</title>',
                '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">',
                '<style>',
                'body{max-width:760px;margin:40px auto;padding:0 20px;',
                'font:15px/1.75 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;',
                'color:#2d2d2d;background:#fff;}',
                'code{background:#f4f2ec;border:1px solid #e3e0d6;border-radius:3px;',
                'padding:1px 5px;font:.88em "SF Mono",Consolas,monospace;}',
                'pre{background:#f7f6f2;border:1px solid #e3e0d6;border-radius:4px;',
                'padding:10px 12px;overflow:auto;}',
                'pre code{background:none;border:none;padding:0;font-size:13px;}',
                'blockquote{margin:.7em 0;padding:4px 14px;border-left:3px solid #c9c4b6;',
                'color:#6b6b6b;background:#faf9f5;}',
                'table{border-collapse:collapse;} th,td{border:1px solid #d8d4cc;padding:5px 12px;}',
                'th{background:#f4f2ec;} img{max-width:100%;}',
                'a{color:#2f6f9f;border-bottom:1px dotted #9db8c9;text-decoration:none;}',
                '</style>',
                '</head>',
                '<body>',
                body,
                '<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"><\/script>',
                '<script>hljs.highlightAll();<\/script>',
                '</body>',
                '</html>'
            ].join('\n');

            var blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'document.html';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        });

        /* 启动：先渲染，再兜底加载依赖，成功后重渲染一次 */
        render();

        loadFirst(MARKED_FALLBACK, function () { return typeof marked !== 'undefined'; }, function (ok) {
            if (!ok) {
                showNotice('Markdown 解析库加载失败（所有 CDN 均不可达）。左侧仍可编辑，但右侧无法渲染。');
                return;
            }
            loadFirst(HLJS_FALLBACK, function () { return !!window.hljs; }, function () {
                render();
            });
        });
    })();
</script>
</body>
</html>
