<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>系统状态</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fafafa;
            color: #18181b;
            font-size: 15px;
            line-height: 1.55;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            padding: 64px 24px 48px;
            flex: 1;
        }

        /* 标题 */
        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 14px;
            font-weight: 600;
            color: #52525b;
            margin-bottom: 28px;
        }

        .brand-mark {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            background: linear-gradient(135deg, #27272a, #52525b);
            color: #fff;
            display: grid;
            place-items: center;
        }

        /* 总状态横幅 */
        .banner {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px 22px;
            border-radius: 14px;
            background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 100%);
            border: 1px solid #d7f0e0;
        }

        .banner-icon {
            flex: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #16a34a;
            color: #fff;
            box-shadow: 0 0 0 5px rgba(22, 163, 74, .1);
        }

        .banner h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 650;
            letter-spacing: -.015em;
        }

        .banner p {
            margin: 2px 0 0;
            font-size: 13px;
            color: #52525b;
        }

        /* 卡片 */
        .card {
            margin-top: 20px;
            background: #fff;
            border: 1px solid #e8e8ec;
            border-radius: 14px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .02);
            padding: 18px 20px 20px;
        }

        .comp-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .comp-name { font-size: 14.5px; font-weight: 600; }

        .comp-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            font-weight: 550;
            color: #16a34a;
        }
        .comp-status .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        /* 90 天条形图：纯 CSS，90 根条，2 根黄色（性能下降） */
        .bars {
            height: 30px;
            border-radius: 4px;
            overflow: hidden;
            background-image:
                /* 黄色条 1：第 30 天 */
                    linear-gradient(90deg,
                    transparent calc(100% * 30 / 90),
                    #fbbf24 calc(100% * 30 / 90),
                    #fbbf24 calc(100% * 31 / 90),
                    transparent calc(100% * 31 / 90)),
                        /* 黄色条 2：第 71 天 */
                    linear-gradient(90deg,
                    transparent calc(100% * 71 / 90),
                    #fbbf24 calc(100% * 71 / 90),
                    #fbbf24 calc(100% * 72 / 90),
                    transparent calc(100% * 72 / 90)),
                        /* 绿色底：正好 90 根 */
                    repeating-linear-gradient(90deg,
                    #34d399 0 calc(100% / 90 - 1px),
                    transparent calc(100% / 90 - 1px) calc(100% / 90));
        }

        .axis {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 11.5px;
            color: #a1a1aa;
        }

        .uptime {
            margin-top: 12px;
            font-size: 12.5px;
            color: #a1a1aa;
        }

        /* 页脚 */
        footer {
            padding: 24px;
            text-align: center;
            font-size: 12.5px;
            color: #a1a1aa;
        }
        footer a { color: #52525b; text-decoration: none; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="wrap">

    <div class="brand">
    <span class="brand-mark">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5" />
      </svg>
    </span>
        系统状态
    </div>

    <!-- 总状态 -->
    <div class="banner">
        <div class="banner-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6 9 17l-5-5" />
            </svg>
        </div>
        <div>
            <h1>所有系统运行正常</h1>
            <p>最后更新于 <span id="updated">2026 年 10 月 24 日 14:30</span></p>
        </div>
    </div>

    <!-- 唯一服务：Web -->
    <div class="card">
        <div class="comp-head">
            <span class="comp-name">Web 应用</span>
            <span class="comp-status"><i class="dot"></i>运行正常</span>
        </div>
        <div class="bars"></div>
        <div class="axis"><span>90 天前</span><span>今天</span></div>
        <div class="uptime">过去 90 天可用性：<strong>99.98%</strong></div>
    </div>

</div>

<footer>
    <a href="#">订阅更新</a>
</footer>

<script>
    (function () {
        var now = new Date();
        var pad = function (n) { return String(n).padStart(2, '0'); };
        var el = document.getElementById('updated');
        if (el) {
            el.textContent =
                now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日 ' +
                pad(now.getHours()) + ':' + pad(now.getMinutes());
        }
    })();
</script>

</body>
</html>
