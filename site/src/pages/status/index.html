<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="查看 /index、/blog、/games 服务的当前状态与过去 90 天可用性。" />
    <title>系统状态</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            color-scheme: light dark;

            --bg: #fafafa;
            --surface: #ffffff;
            --border: #e8e8ec;
            --text: #18181b;
            --text-muted: #52525b;
            --text-subtle: #71717a;

            --green: #15803d;
            --green-bar: #16a34a;
            --green-soft: #f0fdf4;
            --green-border: #d7f0e0;

            --yellow: #b45309;
            --yellow-bar: #d97706;
            --yellow-soft: #fffbeb;
            --yellow-border: #fde68a;

            --red: #b91c1c;
            --red-bar: #dc2626;
            --red-soft: #fef2f2;
            --red-border: #fecaca;

            --accent-contrast: #ffffff;
            --radius: 14px;
            --shadow: 0 1px 2px rgba(0, 0, 0, .02);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #09090b;
                --surface: #18181b;
                --border: #27272a;
                --text: #fafafa;
                --text-muted: #a1a1aa;
                --text-subtle: #a1a1aa;

                --green: #4ade80;
                --green-bar: #22c55e;
                --green-soft: #052e16;
                --green-border: #14532d;

                --yellow: #fbbf24;
                --yellow-bar: #f59e0b;
                --yellow-soft: #451a03;
                --yellow-border: #78350f;

                --red: #f87171;
                --red-bar: #ef4444;
                --red-soft: #450a0a;
                --red-border: #7f1d1d;

                --accent-contrast: #09090b;
                --shadow: 0 1px 2px rgba(0, 0, 0, .4);
            }
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
            line-height: 1.55;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .skip-link {
            position: absolute;
            left: -9999px;
            top: 12px;
            z-index: 100;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            text-decoration: none;
        }

        .skip-link:focus {
            left: 12px;
        }

        .wrap {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 64px 24px 48px;
            flex: 1;
        }

        .wrap:focus {
            outline: none;
        }

        /* 品牌 */
        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .brand-mark {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            background: linear-gradient(135deg, #27272a, #52525b);
            color: #fff;
            display: grid;
            place-items: center;
            flex: none;
        }

        @media (prefers-color-scheme: dark) {
            .brand-mark {
                background: linear-gradient(135deg, #3f3f46, #71717a);
            }
        }

        /* 总状态横幅 */
        .banner {
            --accent: var(--green);
            --accent-soft: var(--green-soft);
            --accent-border: var(--green-border);

            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px 22px;
            border-radius: var(--radius);
            background: linear-gradient(180deg, var(--accent-soft) 0%, var(--surface) 100%);
            border: 1px solid var(--accent-border);
        }

        .banner[data-status="degraded"] {
            --accent: var(--yellow);
            --accent-soft: var(--yellow-soft);
            --accent-border: var(--yellow-border);
        }

        .banner[data-status="outage"] {
            --accent: var(--red);
            --accent-soft: var(--red-soft);
            --accent-border: var(--red-border);
        }

        .banner-icon {
            flex: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--accent);
            color: var(--accent-contrast);
            box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 15%, transparent);
        }

        .banner h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 650;
            letter-spacing: -.015em;
        }

        .banner p {
            margin: 3px 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* 服务列表标题与图例 */
        .services-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin: 28px 0 4px;
        }

        .services-head h2 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 0;
            padding: 0;
            list-style: none;
            font-size: 12.5px;
            color: var(--text-muted);
        }

        .legend li {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .legend-swatch {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            background: var(--green-bar);
            flex: none;
        }

        .legend-swatch.degraded { background: var(--yellow-bar); }
        .legend-swatch.outage { background: var(--red-bar); }

        /* 卡片 */
        .card {
            margin-top: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 20px 20px;
        }

        .comp-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .comp-name {
            margin: 0;
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 14.5px;
            font-weight: 600;
        }

        .comp-name code {
            padding: 1px 6px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: var(--bg);
            color: var(--text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13.5px;
            font-weight: 500;
        }

        .comp-desc {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .comp-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            font-weight: 600;
            white-space: nowrap;
        }

        .comp-status--operational { color: var(--green); }
        .comp-status--degraded { color: var(--yellow); }
        .comp-status--outage { color: var(--red); }

        .comp-status .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            flex: none;
        }

        /* 90 天条形图 */
        .bars {
            display: flex;
            gap: 1px;
            height: 32px;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar {
            flex: 1 1 0;
            min-width: 0;
            border-radius: 1px;
            background: var(--green-bar);
        }

        .bar--degraded { background: var(--yellow-bar); }
        .bar--outage { background: var(--red-bar); }

        .axis {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-subtle);
        }

        .uptime {
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-subtle);
        }

        .uptime strong {
            color: var(--text);
            font-weight: 600;
        }

        /* 历史事件 */
        .events {
            margin-top: 10px;
            font-size: 12.5px;
            color: var(--text-subtle);
        }

        .events summary {
            cursor: pointer;
            color: var(--text-muted);
            font-weight: 500;
        }

        .events summary:hover {
            color: var(--text);
        }

        .events ul {
            margin: 8px 0 0;
            padding: 0 0 0 18px;
        }

        .events li {
            margin: 4px 0;
        }

        .event-day {
            color: var(--text-muted);
        }

        .event-type--degraded {
            color: var(--yellow);
            font-weight: 600;
        }

        .event-type--outage {
            color: var(--red);
            font-weight: 600;
        }

        .events-empty {
            margin: 10px 0 0;
            font-size: 12.5px;
            color: var(--text-subtle);
        }

        /* 页脚 */
        footer {
            padding: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--text-subtle);
        }

        footer a {
            color: var(--text-muted);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        a:focus-visible,
        button:focus-visible,
        summary:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 2px;
            border-radius: 4px;
        }

        @media (max-width: 480px) {
            .wrap {
                padding: 32px 16px;
            }

            .brand {
                margin-bottom: 20px;
            }

            .banner {
                padding: 16px;
                gap: 12px;
            }

            .banner h1 {
                font-size: 16.5px;
            }

            .services-head {
                margin-top: 22px;
            }

            .card {
                padding: 16px;
            }

            .comp-head {
                flex-direction: column;
                gap: 6px;
            }

            .comp-status {
                align-self: flex-start;
            }

            .bars {
                height: 28px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>

<a class="skip-link" href="#main">跳到主要内容</a>

<main class="wrap" id="main" tabindex="-1">
    <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5" />
      </svg>
    </span>
        系统状态
    </div>

    <!-- 总状态 -->
    <section class="banner" id="overall" data-status="operational" aria-labelledby="overall-title">
        <div class="banner-icon" id="overall-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6 9 17l-5-5" />
            </svg>
        </div>
        <div>
            <h1 id="overall-title">所有系统运行正常</h1>
            <p>
                <span id="overall-summary">所有 3 个服务当前可用</span>
                · 最后更新于 <time id="updated">—</time>
            </p>
        </div>
    </section>

    <!-- 服务状态 -->
    <section class="services" aria-labelledby="services-title">
        <div class="services-head">
            <h2 id="services-title">服务状态</h2>
            <ul class="legend" aria-label="状态图例">
                <li><span class="legend-swatch" aria-hidden="true"></span>正常</li>
                <li><span class="legend-swatch degraded" aria-hidden="true"></span>性能下降</li>
                <li><span class="legend-swatch outage" aria-hidden="true"></span>中断</li>
            </ul>
        </div>

        <div id="service-list"></div>
    </section>
</main>

<footer>
    <a href="/feed.xml" title="RSS 订阅">订阅更新</a>
</footer>

<script>
    (function () {
        'use strict';

        /* ---------- 数据 ---------- */
        const services = [
            {
                id: 'index',
                path: '/index',
                name: '首页',
                status: 'operational',
                incidents: []
            },
            {
                id: 'blog',
                path: '/blog',
                name: '博客',
                status: 'operational',
                incidents: [
                    { day: 30, type: 'degraded', note: '响应延迟升高' },
                    { day: 71, type: 'degraded', note: 'CDN 节点异常' }
                ]
            },
            {
                id: 'games',
                path: '/games',
                name: '游戏',
                status: 'operational',
                incidents: [
                    { day: 12, type: 'outage', note: '数据库连接中断' },
                    { day: 58, type: 'degraded', note: '接口超时增加' }
                ]
            }
        ];

        const STATUS_TEXT = {
            operational: '运行正常',
            degraded: '性能下降',
            outage: '服务中断'
        };

        const OVERALL_TEXT = {
            operational: '所有系统运行正常',
            degraded: '部分服务性能下降',
            outage: '部分系统中断'
        };

        const STATUS_ICON = {
            operational:
                '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
            degraded:
                '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
            outage:
                '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>'
        };

        /* ---------- 工具函数 ---------- */
        function getDayStatus(service, day) {
            const incident = service.incidents.find(function (item) {
                return item.day === day;
            });
            return incident ? incident.type : 'operational';
        }

        function countStatuses(service) {
            const counts = { operational: 0, degraded: 0, outage: 0 };

            for (let day = 1; day <= 90; day += 1) {
                counts[getDayStatus(service, day)] += 1;
            }

            return counts;
        }

        function calcUptime(service) {
            let total = 0;

            for (let day = 1; day <= 90; day += 1) {
                const type = getDayStatus(service, day);
                total += type === 'outage' ? 90 : type === 'degraded' ? 99 : 100;
            }

            return (total / 90).toFixed(2);
        }

        function renderBars(service) {
            let html = '';

            for (let day = 1; day <= 90; day += 1) {
                const type = getDayStatus(service, day);
                const label = type === 'operational'
                    ? '正常'
                    : type === 'degraded'
                        ? '性能下降'
                        : '中断';

                html += '<span class="bar bar--' + type + '" title="第 ' + day + ' 天：' + label + '" aria-hidden="true"></span>';
            }

            return html;
        }

        function renderEvents(service) {
            if (service.incidents.length === 0) {
                return '<p class="events-empty">过去 90 天无事件</p>';
            }

            const items = service.incidents.map(function (incident) {
                const typeText = incident.type === 'degraded' ? '性能下降' : '中断';
                return '<li>' +
                    '<span class="event-day">第 ' + incident.day + ' 天</span> · ' +
                    '<span class="event-type event-type--' + incident.type + '">' + typeText + '</span> · ' +
                    incident.note +
                    '</li>';
            }).join('');

            return '<details class="events">' +
                '<summary>历史事件（' + service.incidents.length + '）</summary>' +
                '<ul>' + items + '</ul>' +
                '</details>';
        }

        function cardTemplate(service) {
            const counts = countStatuses(service);
            const summary = '过去 90 天：' + counts.operational + ' 天正常，' +
                counts.degraded + ' 天性能下降，' + counts.outage + ' 天中断';
            const uptime = calcUptime(service);

            return '<article class="card" aria-labelledby="svc-' + service.id + '-title">' +
                '<div class="comp-head">' +
                '<h3 class="comp-name" id="svc-' + service.id + '-title">' +
                '<code>' + service.path + '</code>' +
                '<span class="comp-desc">' + service.name + '</span>' +
                '</h3>' +
                '<span class="comp-status comp-status--' + service.status + '">' +
                '<i class="dot" aria-hidden="true"></i>' +
                STATUS_TEXT[service.status] +
                '</span>' +
                '</div>' +
                '<div class="bars" role="img" aria-label="' + service.path + ' ' + summary + '">' +
                renderBars(service) +
                '</div>' +
                '<div class="axis" aria-hidden="true"><span>90 天前</span><span>今天</span></div>' +
                '<div class="uptime">过去 90 天可用性：<strong>' + uptime + '%</strong></div>' +
                renderEvents(service) +
                '</article>';
        }

        function getOverallStatus() {
            if (services.some(function (service) { return service.status === 'outage'; })) {
                return 'outage';
            }
            if (services.some(function (service) { return service.status === 'degraded'; })) {
                return 'degraded';
            }
            return 'operational';
        }

        /* ---------- 渲染 ---------- */
        document.getElementById('service-list').innerHTML = services.map(cardTemplate).join('');

        const overallStatus = getOverallStatus();
        const overallEl = document.getElementById('overall');
        overallEl.dataset.status = overallStatus;
        document.getElementById('overall-title').textContent = OVERALL_TEXT[overallStatus];
        document.getElementById('overall-icon').innerHTML = STATUS_ICON[overallStatus];

        const totalIncidents = services.reduce(function (sum, service) {
            return sum + service.incidents.length;
        }, 0);

        const summaryPrefix = overallStatus === 'operational'
            ? '所有 ' + services.length + ' 个服务当前可用'
            : overallStatus === 'degraded'
                ? '部分服务当前性能下降'
                : '部分服务当前不可用';

        document.getElementById('overall-summary').textContent =
            summaryPrefix + ' · 过去 90 天共 ' + totalIncidents + ' 次事件';

        /* ---------- 客户端时间（故意保留） ---------- */
        const now = new Date();
        const pad = function (value) {
            return String(value).padStart(2, '0');
        };
        const updatedEl = document.getElementById('updated');

        updatedEl.textContent =
            now.getFullYear() + ' 年 ' +
            (now.getMonth() + 1) + ' 月 ' +
            now.getDate() + ' 日 ' +
            pad(now.getHours()) + ':' + pad(now.getMinutes());
        updatedEl.dateTime = now.toISOString();
    })();
</script>

</body>
</html>
